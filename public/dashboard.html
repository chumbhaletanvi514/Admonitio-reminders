<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admonitio — Water Cooler Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <!-- Toast Notification -->
    <div class="toast-bubble" id="dashToastBox">Profile updated</div>

    <!-- Top Navbar -->
    <nav class="dash-navbar">
        <div class="dash-brand">
            <img src="/images/logo.jpeg" alt="Admonitio Logo" class="dash-logo-img" onerror="this.style.display='none'">
            <div class="dash-brand-name">Admo<span>nitio</span></div>
            <div class="dash-brand-divider"></div>
            <div class="dash-brand-label" id="categoryBadge">Admin Dashboard</div>
        </div>
        
        <div class="dash-nav-right">
            <!-- Square QR Badges shortcut -->
            <a href="/qr-codes" class="btn-qr-square" title="View QR Badges">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span>QR Badges</span>
            </a>

            <!-- Profile Avatar Only (Circular Initials) -->
            <div class="coordinator-avatar-btn" id="coordAvatar" onclick="openProfileModal()" title="Profile & Settings">
                AK
            </div>

            <button class="dash-logout-btn" onclick="logout()" title="Sign Out">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dash-body">
        <div class="dash-welcome-row">
            <div class="dash-welcome-text">
                <h1>Overview</h1>
            </div>
            
            <div class="welcome-actions-group">
                <button class="dash-date-badge btn-reminder-trigger" onclick="triggerManualReminderScan()" title="Manually trigger reminder scan">
                    🔔 Run Reminder Scan
                </button>
                <div class="dash-date-badge">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="currentDateText"></span>
                </div>
            </div>
        </div>

        <!-- 4 Summary Stats (Emoji on Left, Centered Metric & Label) -->
        <div class="dash-stats-row">
            <div class="stat-card">
                <div class="stat-icon-box blue">💧</div>
                <div class="stat-content-center">
                    <div class="stat-value" id="statTotalCoolers">0</div>
                    <div class="stat-label">Assigned Coolers</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-box red">⚠️</div>
                <div class="stat-content-center">
                    <div class="stat-value" id="statActiveTickets">0</div>
                    <div class="stat-label">Active Tickets</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-box yellow">🛠️</div>
                <div class="stat-content-center">
                    <div class="stat-value" id="statInMaintenance">0</div>
                    <div class="stat-label">In Maintenance</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-box green">✓</div>
                <div class="stat-content-center">
                    <div class="stat-value" id="statResolvedTickets">0</div>
                    <div class="stat-label">Resolved Tickets</div>
                </div>
            </div>
        </div>

        <!-- Devices Grid Section -->
        <div class="section-title-bar">
            <div>
                <h2>Assigned Devices</h2>
            </div>
            <div class="device-count-badge" id="deviceCountBadge">0 Devices Found</div>
        </div>

        <div class="device-cards-grid" id="devicesContainer">
            <!-- Dynamically populated from JS -->
        </div>
    </main>

    <!-- Coordinator Profile Settings Modal -->
    <div class="modal-overlay" id="profileSettingsModal">
        <div class="prompt-modal-box">
            <h3>Coordinator Profile Settings</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                Update the destination email for pending ticket reminders.
            </p>

            <form onsubmit="handleProfileSave(event)" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
                <div class="profile-form-group">
                    <label>Notification Email (Reminders Destination)</label>
                    <input type="email" id="editEmailInput" class="profile-input" required>
                </div>
                <div class="profile-form-group">
                    <label>New Password (Optional, leave blank to keep unchanged)</label>
                    <input type="password" id="editPasswordInput" class="profile-input" placeholder="••••••••">
                </div>

                <div class="modal-actions-row" style="margin-top: 8px;">
                    <button type="button" class="btn-modal-cancel" onclick="closeProfileModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn-modal-save">
                        Save Settings
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
