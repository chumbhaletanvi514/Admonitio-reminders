<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admonitio — Coordinator Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="toast-bubble" id="toastBox">
    <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span id="toastText">Logged in</span>
</div>

<div class="login-split">
    <!-- LEFT 50%: ENHANCED BRAND HERO PANEL -->
    <div class="hero-panel">
        <div class="hero-content">
            <div class="hero-brand">
                <img src="/images/logo.jpeg" alt="Admonitio Logo" class="hero-logo-img" onerror="this.style.display='none'">
                <div class="hero-brand-name">Admo<span>nitio</span></div>
            </div>

            <h1 class="hero-title">Water Cooler<br>Management Portal</h1>
            <p class="hero-subtitle">Authorized coordinator portal for real-time reviews, status updates, and maintenance reminders.</p>
        </div>
    </div>

    <!-- RIGHT 50%: CLEAN CREDENTIALS FORM PANEL -->
    <div class="form-panel">
        <div class="form-panel-inner">
            <h2 class="form-heading">Sign in to your account</h2>
            <p class="form-subheading">Enter your allocated credentials to manage devices.</p>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Coordinator ID / Email</label>
                    <div class="input-wrapper" id="idWrapper">
                        <input type="text" class="login-input" id="username" placeholder="e.g. ashok.maintenance@college.edu" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper" id="pwWrapper">
                        <input type="password" class="login-input" id="password" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility()">
                            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn-cta" id="loginBtn">
                    <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    Sign In to Dashboard
                </button>

                <div class="error-banner" id="errorBanner">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    <span id="errorText">Invalid credentials</span>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
